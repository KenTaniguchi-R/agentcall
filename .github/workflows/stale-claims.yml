name: Release stale claims

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen, without changing anything'
        type: boolean
        default: true
      stale_days:
        description: 'Days of inactivity before a claim is released (blank = 3)'
        type: string
        required: false

# The 09:00 schedule and a manual dispatch can otherwise overlap, which would
# comment "claim released" twice on the same issue. Serialize rather than
# cancel: `cancel-in-progress: true` could kill the job between the comment and
# the unassign — or partway through a multi-assignee issue — leaving a claim
# that stands under a note saying it was released.
#
# Not a queue. GitHub keeps one running and one *pending* run per group, and a
# newer trigger replaces the pending one, so a dispatch can supersede a waiting
# scheduled sweep. A sweep can therefore be skipped; it can never overlap.
concurrency:
  group: stale-claims
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release stale claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A manual dispatch defaults to dry-run so poking at it is safe. The
          # schedule supplies no inputs, so this must evaluate to 'false' there
          # or the reaper never actually reaps — and the logs still look fine.
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          # Left empty by the schedule; the script falls back to 3.
          STALE_DAYS: ${{ inputs.stale_days }}
        run: bash scripts/reap-stale-claims.sh
