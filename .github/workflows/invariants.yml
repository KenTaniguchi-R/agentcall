name: Invariants

# The rules in CLAUDE.md that nothing currently enforces. Deterministic checks
# only -- no model, no secrets, no network. Runs read-only: findings surface as
# GitHub annotations on the PR, which need no write permission.
# `scripts/ci-local.sh fast` ports every check below and runs from a pre-push
# hook; a check added here must be added there too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need the base branch to diff against.
          fetch-depth: 0

      - name: Determine comparison base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            base="origin/${GITHUB_BASE_REF}"
          elif [ -n "$PUSH_BEFORE" ] &&
               [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git rev-parse --verify "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
            base="$PUSH_BEFORE"
          else
            # github.event.before is all zeroes for a branch's first push.
            # main normally has a parent, so retain a useful fallback rather
            # than constructing the invalid `origin/` ref this workflow used
            # before it supported push events.
            base="HEAD^"
          fi
          echo "INVARIANTS_BASE=$base" >> "$GITHUB_ENV"
          echo "Comparing $base...HEAD"

      - name: Third-party actions are immutable
        run: ruby scripts/verify-action-pins.rb

      - name: Protocol frames must live in packages/shared
        run: |
          # A frame is identifiable by its `type:` discriminator, which is
          # always a STRING literal -- type: z.literal("call_request"). Anywhere
          # outside packages/shared that means a frame shape was redefined
          # locally instead of imported from the single source of truth.
          #
          # Match the `type:` KEY, not a bare string literal. Two rounds of
          # false positives came from matching less:
          #   z.literal(         -> `version: z.literal(1)` in rosters.ts, a
          #                         local file-format tag. Fixed by requiring
          #                         the quote.
          #   z.literal("        -> `state: z.literal("active"|"retired")` in
          #                         keys.ts, the on-disk epoch state union, and
          #                         `format: z.literal(2)` beside it. Same class
          #                         of thing: a local file format, not a frame.
          # Requiring `type:` costs no coverage, because a redefined frame must
          # carry that discriminator to be a frame at all. protocol.ts holds 10
          # string literals, 8 of them `type:` discriminators; the other two
          # (`origin: z.literal("relay")`, `code: z.literal("protocol_error")`)
          # are field constraints INSIDE a frame, not frame identifiers. No
          # declaration splits the key and the literal across lines.
          hits=$(grep -rnE 'type:\s*z\.literal\("' apps/relay/src packages/cli/src || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::Protocol frame defined outside packages/shared. Frame shapes are declared once in packages/shared/src/protocol.ts and imported -- see CLAUDE.md."
            done
            exit 1
          fi
          echo "OK: no frame shapes declared outside packages/shared"

      - name: Stored cards parse through the guarded boundary
        run: |
          hits=$(git ls-files -z 'apps/relay/src/**/*.ts' 'apps/relay/src/*.ts' | sort -z | \
            xargs -0 perl -0ne 'while (/CardUpload\.(safeParse|parse)\s*\(/g) { print "$ARGV:$1\n" }')
          expected=$(printf '%s\n' \
            'apps/relay/src/index.ts:safeParse' \
            'apps/relay/src/stored-card.ts:parse')
          if [ "$hits" != "$expected" ]; then
            echo "$hits" | while IFS=: read -r file _; do
              [ -z "$file" ] || echo "::error file=$file::CardUpload parsing is limited to upload validation and parseStoredCard; stored reads must use the guarded boundary so legacy rows cannot 500 endpoints."
            done
            exit 1
          fi
          echo "OK: stored cards parse only through the guarded boundary"

      - name: Relay authentication uses the shared middleware seam
        run: |
          test "$(grep -F 'app.use(\"/v1/*\", requireIdentity)' apps/relay/src/index.ts)" || {
            echo "::error file=apps/relay/src/index.ts::Missing the fail-closed /v1 identity middleware."; exit 1;
          }
          test "$(grep -F 'PUBLIC_V1_PATHS' apps/relay/src/middleware.ts)" || {
            echo "::error file=apps/relay/src/middleware.ts::Missing the explicit public route allowlist."; exit 1;
          }
          if grep -Fq 'startsWith("/v1/room/")' apps/relay/src/middleware.ts ||
             grep -Fq 'startsWith("/v1/a2a/")' apps/relay/src/middleware.ts ||
             ! grep -Fq 'requireA2AIdentity' apps/relay/src/a2a.ts; then
            echo "::error file=apps/relay/src/middleware.ts::Identity exceptions must be explicit and A2A must use its route-local seam."; exit 1;
          fi
          unexpected=$(grep -rl 'authenticateRequest' apps/relay/src --include='*.ts' | grep -vE '/(tenant|middleware|a2a)\.ts$' || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected" | while IFS= read -r file; do
              echo "::error file=$file::Inline relay authentication remains outside the approved middleware/A2A seams.";
            done
            exit 1
          fi
          echo "OK: relay authentication uses the shared middleware seam"

      - name: The hosted relay host is written once
        run: |
          # Keep identical to inv_hosted_relay_host in scripts/ci-local.sh. This host
          # used to be a separate literal in four files, so a rebrand meant finding
          # all four. packages/shared/src/a2a/card.ts is allowlisted
          # deliberately: AGENTCALL_POLICY_EXT is a stable namespace URI that must
          # NOT follow a host change -- see its comment.
          host=$(perl -ne 'print $1 if /^export const HOSTED_RELAY_HOST = "([^"]+)"/' \
            packages/shared/src/protocol.ts)
          if [ -z "$host" ]; then
            echo "::error file=packages/shared/src/protocol.ts::HOSTED_RELAY_HOST must be declared here."
            exit 1
          fi
          route=$(perl -ne 'print $1 if /"pattern":\s*"([^"]+)",\s*"custom_domain":\s*true/' \
            apps/relay/wrangler.jsonc)
          if [ "$route" != "$host" ]; then
            echo "::error file=apps/relay/wrangler.jsonc::Custom domain \"$route\" does not match HOSTED_RELAY_HOST \"$host\"."
            exit 1
          fi
          strays=$(grep -rlF "$host" apps/relay/src packages/cli/src packages/shared/src 2>/dev/null | \
            grep -vE 'packages/shared/src/(protocol\.ts|a2a/card\.ts)$' || true)
          if [ -n "$strays" ]; then
            echo "$strays" | while read -r file; do
              [ -z "$file" ] || echo "::error file=$file::Import HOSTED_RELAY_HOST from @benree/agentcall-shared instead of repeating the hosted relay host literal."
            done
            exit 1
          fi
          echo "OK: hosted relay host is declared once and matches the wrangler route"

      - name: Historical docs are never revised
        run: |
          # Adding a new dated plan/spec is normal, and so is editing one while
          # the work it describes is still in flight -- that is authoring, not
          # revision. What the rule forbids is going back to an old record and
          # updating it to match code that has since changed.
          #
          # These filenames carry their own date, so the two cases are
          # distinguishable: only flag an edit to a doc dated well in the past.
          GRACE_DAYS=14
          today=$(date -u +%s)
          modified=$(git diff --name-only --diff-filter=M \
            "${INVARIANTS_BASE}...HEAD" \
            -- 'docs/superpowers/**' 'docs/security/2026-07-16-security-review.md' || true)
          for file in $modified; do
            # Pull YYYY-MM-DD off the front of the basename.
            stamp=$(basename "$file" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ -z "$stamp" ]; then
              continue
            fi
            doc_date=$(date -u -d "$stamp" +%s 2>/dev/null || echo 0)
            if [ "$doc_date" -eq 0 ]; then
              continue
            fi
            age_days=$(( (today - doc_date) / 86400 ))
            if [ "$age_days" -gt "$GRACE_DAYS" ]; then
              echo "::warning file=$file::Revising a historical document (dated $stamp, ${age_days}d ago). These are dated records kept as written and are deliberately not updated when behavior changes -- correct README.md/CHANGELOG.md instead. Ignore this if you are fixing a typo."
            fi
          done
          echo "OK: checked historical docs"

      - name: Applied D1 migration history is append-only
        run: |
          manifest=apps/relay/migrations/.immutable
          test -f "$manifest" || { echo "::error file=$manifest::Missing immutable migration ledger."; exit 1; }

          # Every SQL migration must be recorded, and every recorded filename
          # must exist. The manifest can only grow at the end.
          invalid=$(find apps/relay/migrations -maxdepth 1 -name '*.sql' ! -type f -print -quit)
          test -z "$invalid" || { echo "::error file=$invalid::Migrations must be regular files, not symlinks."; exit 1; }
          if [ -n "$(tail -c 1 "$manifest")" ]; then
            echo "::error file=$manifest::The immutable migration ledger must end with a newline."
            exit 1
          fi
          actual=$(find apps/relay/migrations -maxdepth 1 -name '*.sql' -type f -exec basename {} \; | sort)
          recorded=$(cat "$manifest")
          if [ "$actual" != "$recorded" ]; then
            echo "::error file=$manifest::Migration files and the immutable ledger differ. Add new migrations to both; never rename old ones."
            diff -u <(echo "$recorded") <(echo "$actual") || true
            exit 1
          fi

          if git cat-file -e "${INVARIANTS_BASE}:$manifest" 2>/dev/null; then
            git show "${INVARIANTS_BASE}:$manifest" > /tmp/base-migrations
            base_bytes=$(wc -c < /tmp/base-migrations | tr -d ' ')
            if ! diff -u /tmp/base-migrations <(head -c "$base_bytes" "$manifest"); then
              echo "::error file=$manifest::The applied migration ledger is append-only."
              exit 1
            fi
            while IFS= read -r file || [ -n "$file" ]; do
              if ! git cat-file -e "HEAD:apps/relay/migrations/$file" 2>/dev/null ||
                 ! git diff --quiet "$INVARIANTS_BASE" HEAD -- "apps/relay/migrations/$file"; then
                echo "::error file=apps/relay/migrations/$file::Applied migrations are immutable; add a new migration instead."
                exit 1
              fi
            done < /tmp/base-migrations
          fi
          echo "OK: D1 migration history is append-only"

      - name: Open work stays in GitHub Issues
        run: |
          # gh issue list is the status board. A markdown TODO drifts from it
          # immediately and then quietly becomes wrong.
          added=$(git diff --name-only --diff-filter=A \
            "${INVARIANTS_BASE}...HEAD" || true)
          for file in $added; do
            case "$(basename "$file" | tr '[:upper:]' '[:lower:]')" in
              todo.md|tasks.md|roadmap.md|backlog.md)
                echo "::error file=$file::Open work is tracked in GitHub Issues, not in a file -- see CLAUDE.md."
                exit 1
                ;;
            esac
          done
          echo "OK: no markdown task board reintroduced"

      - name: Test files don't shrink alongside a src/ change
        run: |
          # Keep identical to inv_test_churn in scripts/ci-local.sh -- see its
          # comment for why this checks net line count on MODIFIED test files
          # rather than failing on any test file touched alongside src/ (that
          # would fail nearly every ordinary TDD PR this repo's CLAUDE.md
          # requires). #335: nothing else stops a stuck loop from quietly
          # relaxing the check that would catch its own broken change.
          test_globs=(packages/*/test packages/*/test/* apps/relay/test apps/relay/test/*)
          src_globs=(packages/*/src packages/*/src/* apps/relay/src apps/relay/src/*)
          modified_tests=$(git diff --name-only --diff-filter=M "${INVARIANTS_BASE}...HEAD" -- "${test_globs[@]}" 2>/dev/null || true)
          touched_src=$(git diff --name-only --diff-filter=ACMR "${INVARIANTS_BASE}...HEAD" -- "${src_globs[@]}" 2>/dev/null || true)

          shrunk=""
          if [ -n "$modified_tests" ] && [ -n "$touched_src" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              read -r added deleted rest <<< "$(git diff --numstat "${INVARIANTS_BASE}...HEAD" -- "$file" 2>/dev/null)"
              if [ "${deleted:-0}" -gt "${added:-0}" ]; then
                shrunk+="$file (+${added:-0}/-${deleted:-0})"$'\n'
              fi
            done <<< "$modified_tests"
          fi

          if [ -n "$shrunk" ]; then
            echo "$shrunk" | while IFS= read -r line; do
              [ -n "$line" ] || continue
              file=${line%% *}
              echo "::error file=$file::An existing test file lost more lines than it gained on a branch that also changed src/. If this is a deliberate simplification rather than a weakened check, that's fine -- this heuristic cannot tell the difference by itself, a human confirming by reading the diff can."
            done
            exit 1
          fi

          if [ -n "$touched_src" ]; then
            added_test_lines=0
            while IFS= read -r test_file; do
              [ -n "$test_file" ] || continue
              read -r added rest <<< "$(git diff --numstat "${INVARIANTS_BASE}...HEAD" -- "$test_file" 2>/dev/null)"
              added_test_lines=$((added_test_lines + ${added:-0}))
            done < <(git diff --name-only --diff-filter=ACMR "${INVARIANTS_BASE}...HEAD" -- "${test_globs[@]}" 2>/dev/null || true)
            if [ "$added_test_lines" -eq 0 ]; then
              echo "::warning::src/ changed with no lines added to any test file -- confirm existing coverage already exercises this."
            fi
          fi
          echo "OK: no test file shrank alongside a src/ change"

      - name: The local gate mirrors this workflow's verify job
        run: |
          # scripts/ci-local.sh calls itself a faithful mirror of ci.yml's
          # verify job, and with automatic runs paused it is the only gate a
          # push crosses. Nothing enforced the claim, and it drifted: docs:check
          # and the wrangler bundle ran in ci.yml and not there, so the pre-push
          # hook passed commits CI would have failed.
          #
          # Every shell step in the verify job is classified inside ci-local.sh
          # as mirrored (the command appears verbatim in run_verify) or
          # knowingly unmirrored. A new step is in neither list and fails there.
          # This step runs that same assertion from CI's side, so the two cannot
          # drift while only one of them is being run.
          if bash scripts/ci-local.sh mirror-check; then
            echo "OK: scripts/ci-local.sh mirrors the verify job"
          else
            echo "::error file=scripts/ci-local.sh::The local gate has drifted from ci.yml's verify job -- see CLAUDE.md."
            exit 1
          fi
