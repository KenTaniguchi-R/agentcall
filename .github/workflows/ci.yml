name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version pin: reads packageManager from the root package.json, so the
      # lockfile and CI can never drift onto different pnpm majors.
      - uses: pnpm/action-setup@v6

      # 24 only. Not the `engines: >=20` floor -- pnpm 11.5.2 requires node
      # >=22.13, so the toolchain cannot install this repo on 20 at all, and
      # that floor is a promise to *consumers* of the published CLI which a
      # workspace build does not exercise anyway. See CLAUDE.md.
      #
      # `cache: pnpm` stays explicit. setup-node v5 added automatic caching
      # driven by the root `packageManager` field, and v6 narrowed that
      # automatic path to npm only -- so on v6+ dropping this line would
      # silently stop caching the pnpm store rather than keep working.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: packages/cli typechecks against packages/shared's built
      # dist, so a build after typecheck would check the previous run's types.
      - run: pnpm -r build

      # Covers src *and* test — see tsconfig.test.json in shared/ and cli/.
      - run: pnpm -r typecheck

      - run: pnpm -r test
